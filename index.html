<!DOCTYPE html>
<html lang="af">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geskenkwinkel Voorraad v2.2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    
    <!-- Voeg Cropper.js by vir die sny-blokkie -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Merriweather:wght@700&display=swap');
        .font-serif { font-family: 'Merriweather', serif; }
        #reader { width: 100%; max-width: 400px; margin: 0 auto; display: none; }
    </style>
</head>
<body class="bg-gray-100 flex justify-center items-start min-h-screen p-4 sm:pt-10">

    <div class="bg-white rounded-lg shadow-lg w-full max-w-md overflow-hidden border border-gray-200">
        
        <div class="bg-[#111827] text-white p-6 rounded-t-lg relative">
            <!-- Weergawe nommer regs bo -->
            <span class="absolute top-4 right-4 bg-gray-700 text-gray-300 text-xs font-bold px-2 py-1 rounded">v2.2</span>
            
            <p class="text-[#f97316] text-xs font-bold tracking-widest uppercase mb-1">Ewige Lig</p>
            <h1 class="text-3xl font-serif font-bold mb-2">Geskenkwinkel</h1>
            <p class="text-gray-300 text-sm leading-relaxed">
                Skandeer die item se streepkode, lees die naam, en voeg by die voorraad.
            </p>
        </div>

        <!-- Die onsigbare iframe wat die Google Sheets blokkasie omseil -->
        <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

        <!-- Die vorm wys na jou LAASTE spesifieke Google Apps Script URL -->
        <form id="geskenkForm" target="hidden_iframe" action="https://script.google.com/macros/s/AKfycbxcp3mTzqzwSZsy3tmzMSL7t3BR4_Kwt3EehGoUmecP74DeZzbZdgvMI6OUFWOsxnutKQ/exec" method="POST" class="p-6 space-y-5">
            
            <!-- Datum -->
            <div>
                <label class="block text-gray-800 text-sm font-semibold mb-2">Datum</label>
                <input type="text" name="date" id="dateInput" class="w-full px-4 py-3 rounded-lg border border-gray-200 bg-gray-50 text-gray-500 focus:outline-none" readonly>
            </div>

            <!-- Streepkode -->
            <div>
                <label class="block text-gray-800 text-sm font-semibold mb-2">Streepkode</label>
                <div class="relative">
                    <input type="text" name="barcode" id="barcodeInput" placeholder="Bv. 600123456789" required class="w-full px-4 py-3 pr-12 rounded-lg border border-gray-200 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition-colors">
                    <button id="scanBtn" type="button" class="absolute right-2 top-2 p-1.5 text-gray-400 hover:text-blue-600 bg-gray-50 hover:bg-blue-50 rounded-md transition-colors" title="Skandeer met kamera">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m-8-8h16M4 8h.01M4 16h.01M20 8h.01M20 16h.01M8 4h.01M16 4h.01M8 20h.01M16 20h.01"></path>
                        </svg>
                    </button>
                </div>
                <div id="reader" class="mt-2 rounded-lg border border-gray-300 overflow-hidden"></div>
            </div>

            <!-- Item Naam met Kamera Opsie -->
            <div>
                <label class="block text-gray-800 text-sm font-semibold mb-2">Item Naam (Maks 20 letters)</label>
                <div class="relative">
                    <input type="text" name="itemName" id="itemName" maxlength="20" placeholder="Bv. Groot Bybel" required class="w-full px-4 py-3 pr-12 rounded-lg border border-gray-200 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition-colors">
                    <button id="ocrBtn" type="button" class="absolute right-2 top-2 p-1.5 text-gray-400 hover:text-[#ea580c] bg-gray-50 hover:bg-orange-50 rounded-md transition-colors" title="Lees naam met OCR">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
                        </svg>
                    </button>
                </div>
                <input type="file" accept="image/*" capture="environment" id="ocrInput" class="hidden">
                <p id="ocrStatus" class="text-[#ea580c] font-bold text-xs mt-2 hidden animate-pulse text-right">Besig om teks te lees...</p>
                <p id="photoAttachedMsg" class="text-green-600 font-bold text-xs mt-2 hidden text-right">✓ Foto gestoor vir sigblad</p>
            </div>

            <!-- Prys en Hoeveelheid -->
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-gray-800 text-sm font-semibold mb-2">Prys (R)</label>
                    <input type="number" name="price" id="itemPrice" placeholder="0.00" step="0.01" required class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition-colors">
                </div>
                <div>
                    <label class="block text-gray-800 text-sm font-semibold mb-2">Aantal</label>
                    <input type="number" name="aantal" id="itemQuantity" placeholder="1" value="1" required class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition-colors">
                </div>
            </div>
            
            <input type="hidden" name="foto" id="fotoInput" value="Geen foto">

            <!-- Submit -->
            <div class="pt-4">
                <button type="submit" id="submitBtn" class="w-full bg-[#ea580c] hover:bg-[#c2410c] text-white font-bold py-4 px-4 rounded-lg transition-colors">
                    Voeg by voorraad
                </button>
            </div>
        </form>
    </div>

    <!-- Sny (Crop) Modaal -->
    <div id="cropModal" class="fixed inset-0 bg-black z-[100] hidden flex-col">
        <div class="flex-1 w-full overflow-hidden flex items-center justify-center p-2">
            <img id="cropImage" src="" alt="Crop preview" class="max-w-full max-h-full block">
        </div>
        <div class="bg-gray-900 p-4 flex justify-between items-center text-white pb-8">
            <button type="button" id="cancelCropBtn" class="px-4 py-2 bg-red-600 hover:bg-red-700 rounded font-bold">Kanselleer</button>
            <span class="text-xs md:text-sm font-semibold text-gray-300 mx-2 text-center">Trek blokkie oor naam</span>
            <button type="button" id="applyCropBtn" class="px-4 py-2 bg-green-600 hover:bg-green-700 rounded font-bold">Lees Teks</button>
        </div>
    </div>

    <!-- Waarskuwing Modaal -->
    <div id="alertModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-[110]">
        <div class="bg-white rounded-lg p-6 max-w-sm w-11/12 text-center shadow-xl">
            <h3 class="mb-5 text-lg font-bold text-gray-800" id="alertMessage">Boodskap</h3>
            <button id="closeAlertBtn" type="button" class="text-white bg-[#ea580c] hover:bg-[#c2410c] font-medium rounded-lg text-sm px-5 py-2.5">
                Verstaan
            </button>
        </div>
    </div>

    <!-- Hier is die ekstra canvas vir beeldverwerking -->
    <canvas id="preprocessCanvas" style="display:none;"></canvas>

    <script>
        // Formateer datum
        const today = new Date();
        let dd = String(today.getDate()).padStart(2, '0');
        let mm = String(today.getMonth() + 1).padStart(2, '0');
        document.getElementById('dateInput').value = dd + '/' + mm + '/' + today.getFullYear();

        function showAlert(message) {
            document.getElementById('alertMessage').innerText = message;
            document.getElementById('alertModal').classList.remove('hidden');
        }
        document.getElementById('closeAlertBtn').addEventListener('click', () => {
            document.getElementById('alertModal').classList.add('hidden');
        });

        // 1. STREEPKODE GEHEUE (Leer)
        let barcodeMemory = JSON.parse(localStorage.getItem('geskenkMemory')) || {};
        const barcodeInput = document.getElementById('barcodeInput');
        
        barcodeInput.addEventListener('input', (e) => {
            const code = e.target.value.trim();
            if (barcodeMemory[code]) {
                document.getElementById('itemName').value = barcodeMemory[code].name;
                document.getElementById('itemPrice').value = barcodeMemory[code].price;
            }
        });

        // 2. KAMERA SKANDEERDER VIR STREEPKODES
        let html5QrcodeScanner = null;
        document.getElementById('scanBtn').addEventListener('click', () => {
            const readerDiv = document.getElementById('reader');
            if (readerDiv.style.display === 'block') {
                if (html5QrcodeScanner) {
                    html5QrcodeScanner.stop().then(() => {
                        html5QrcodeScanner.clear();
                        readerDiv.style.display = 'none';
                    });
                }
                return;
            }
            readerDiv.style.display = 'block';
            html5QrcodeScanner = new Html5Qrcode("reader");
            html5QrcodeScanner.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 100 } },
                (decodedText) => {
                    barcodeInput.value = decodedText;
                    barcodeInput.dispatchEvent(new Event('input'));
                    html5QrcodeScanner.stop().then(() => {
                        html5QrcodeScanner.clear();
                        readerDiv.style.display = 'none';
                    });
                },
                (error) => {}
            ).catch((err) => {
                readerDiv.style.display = 'none';
                showAlert("Kamera geblokkeer. Jou blaaier vereis 'n veilige verbinding (https://) of toestemming.");
            });
        });

        // 3. OCR (KIES FOTO -> SNY BLOKKIE -> BEELDVERWERKING -> LEES)
        let cropper = null;

        document.getElementById('ocrBtn').addEventListener('click', () => {
            document.getElementById('ocrInput').click();
        });

        document.getElementById('ocrInput').addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                const imageElement = document.getElementById('cropImage');
                imageElement.src = url;
                
                // Maak die swart sny-modaal oop
                document.getElementById('cropModal').classList.remove('hidden');
                document.getElementById('cropModal').classList.add('flex');

                if (cropper) {
                    cropper.destroy();
                }

                // Begin cropper sodra die foto gelaai is
                imageElement.onload = () => {
                    cropper = new Cropper(imageElement, {
                        viewMode: 1,
                        dragMode: 'crop',
                        autoCropArea: 0.5,
                        background: false,
                        zoomable: true,
                        movable: true,
                    });
                };
            }
            event.target.value = '';
        });

        document.getElementById('cancelCropBtn').addEventListener('click', () => {
            document.getElementById('cropModal').classList.add('hidden');
            document.getElementById('cropModal').classList.remove('flex');
            if (cropper) {
                cropper.destroy();
                cropper = null;
            }
        });

        document.getElementById('applyCropBtn').addEventListener('click', async () => {
            if (!cropper) return;
            
            const originalCanvas = cropper.getCroppedCanvas();
            if (!originalCanvas) return;

            document.getElementById('cropModal').classList.add('hidden');
            document.getElementById('cropModal').classList.remove('flex');
            
            const statusText = document.getElementById('ocrStatus');
            const attachedMsg = document.getElementById('photoAttachedMsg');
            statusText.classList.remove('hidden');
            attachedMsg.classList.add('hidden');
            document.getElementById('itemName').value = ""; 

            // Stoor die oorspronklike gesnyde foto (in kleur) vir die Google Sheet 
            // Gebruik laer kwaliteit (0.3) sodat dit as teks in een sel in Google Sheets pas!
            const sheetPhotoDataUrl = originalCanvas.toDataURL('image/jpeg', 0.3);
            document.getElementById('fotoInput').value = sheetPhotoDataUrl;

            // STAP 1: Beeldverwerking vir die OCR (Maak swart-en-wit en verhoog kontras)
            const prepCanvas = document.getElementById('preprocessCanvas');
            const ctx = prepCanvas.getContext('2d');
            prepCanvas.width = originalCanvas.width;
            prepCanvas.height = originalCanvas.height;
            
            // Teken die prent op die nuwe canvas en wend 'n filter aan
            ctx.filter = 'contrast(200%) grayscale(100%) brightness(120%)';
            ctx.drawImage(originalCanvas, 0, 0);

            const processedDataUrl = prepCanvas.toDataURL('image/jpeg');
            
            try {
                // STAP 2: Lees teks (Terug na die veilige metode wat op alle fone werk)
                const result = await Tesseract.recognize(processedDataUrl, 'eng');
                let recognizedText = result.data.text.trim().replace(/\n/g, ' '); 
                
                // STAP 3: Die Slim Filter
                recognizedText = recognizedText.replace(/[^a-zA-Z0-9\s\-%&]/g, '').trim();
                
                document.getElementById('itemName').value = recognizedText.substring(0, 20);
                attachedMsg.classList.remove('hidden'); // Wys vir gebruiker die foto is aangeheg

            } catch (error) {
                console.error("OCR fout:", error);
                showAlert("Kon nie die teks lees nie.");
            } finally {
                statusText.classList.add('hidden');
                if (cropper) {
                    cropper.destroy();
                    cropper = null;
                }
            }
        });

        // 4. VORM SUBMIT (Stuur na Google Sheets via onsigbare Iframe)
        let isSubmitted = false;
        document.getElementById('geskenkForm').addEventListener('submit', () => {
            const barcode = document.getElementById('barcodeInput').value.trim();
            const itemName = document.getElementById('itemName').value.trim();
            const price = document.getElementById('itemPrice').value.trim();
            
            barcodeMemory[barcode] = { name: itemName, price: price };
            localStorage.setItem('geskenkMemory', JSON.stringify(barcodeMemory));

            isSubmitted = true;
            const btn = document.getElementById('submitBtn');
            btn.innerText = "Besig om te stoor...";
            btn.disabled = true;
            btn.classList.add('opacity-70');
        });

        function frameLoaded() {
            if (isSubmitted) {
                isSubmitted = false;
                
                document.getElementById('barcodeInput').value = '';
                document.getElementById('itemName').value = '';
                document.getElementById('itemPrice').value = '';
                document.getElementById('itemQuantity').value = '1';
                document.getElementById('fotoInput').value = 'Geen foto';
                document.getElementById('photoAttachedMsg').classList.add('hidden');
                
                const btn = document.getElementById('submitBtn');
                btn.innerText = "Voeg by voorraad";
                btn.disabled = false;
                btn.classList.remove('opacity-70');

                document.getElementById('barcodeInput').focus();
                showAlert("Sukses! Die item is by jou Google Sheet gevoeg.");
            }
        }

        // Koppel die 'load' event hier sodat die funksie verseker reeds bestaan
        document.getElementById('hidden_iframe').addEventListener('load', frameLoaded);
    </script>
</body>
</html>
